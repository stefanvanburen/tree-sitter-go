name: Lint

on:
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - LICENSE
      - .editorconfig
      - .gitattributes
      - .gitignore
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
      - .editorconfig
      - .gitattributes
      - .gitignore

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: ${{vars.NODE_VERSION}}
      - name: Install modules
        run: npm ci --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint
